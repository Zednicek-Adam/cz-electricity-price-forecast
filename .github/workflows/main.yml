# What a push to `main` does (ADR-0010, ADR-0016): export, build, deploy. A
# merged pull request and the daily run's data commit land here the same way:
# the daily run pushes with a deploy key, so its push starts this workflow.
#
# No path filtering: "`main` is exactly what is deployed" holds without
# qualification.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes in quick succession deploy one after the other, never at once, so
# an older build cannot land on top of a newer one.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  # The built client and the files the export writes, one Worker serving static
  # assets only. The export checks the records first and fails the deploy
  # rather than publish a record it cannot vouch for.
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: forecast
          enable-cache: true
      - run: uv sync --locked --no-dev
        working-directory: forecast
      - run: uv run --no-dev python -m forecast.export
        working-directory: forecast
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cz-epf/web build
      - name: wrangler deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "main ${GITHUB_SHA::7}"
