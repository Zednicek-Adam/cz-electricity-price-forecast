# What a merge to `main` does (ADR-0010): `migrate`, then `deploy`, in that
# order, so a deploy never queries a column that does not exist yet.
#
# No path filtering: "`main` is exactly what is deployed" holds without
# qualification.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two merges in quick succession must not migrate concurrently, and a queued
# migration must not be cancelled half-way through a deploy sequence.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      # Connects as the Neon owner, because `GRANT` requires ownership and every
      # grant lives in a migration (ADR-0005). The same pinned dbmate image as
      # the gate, but with no local database behind it (`--no-deps`) and no
      # schema dump: the committed file is regenerated by the gate, not here.
      #
      # `up` only. Migrations are expand-only and `dbmate down` is never run
      # against Neon, so "migration succeeded, deploy failed" is a no-op that
      # re-running the deploy recovers from.
      - name: dbmate up against Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_OWNER }}
        run: >
          docker compose run --rm --no-deps -e DATABASE_URL
          dbmate --wait --no-dump-schema up

  # The built client and the API, one Worker (docs/research/
  # cloudflare-static-assets.md). The Worker reads Neon through `NEON_READER`,
  # a secret set on the Worker with `wrangler secret put`, never in GitHub.
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cz-epf/web build
      - name: wrangler deploy
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "main ${GITHUB_SHA::7}"
