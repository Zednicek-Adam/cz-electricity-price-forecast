# The pull request gate (ADR-0010): two parallel jobs behind one required
# aggregator. `all-green` is the only required check, so a merge is gated on one
# status rather than on remembering which jobs matter.
#
# No `paths` or `paths-ignore` filter, anywhere. A filtered job that is also a
# required check stays pending forever and blocks the merge, and every job here
# takes a minute or two. Nothing needs Docker or a database (ADR-0016).
name: gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecast
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: forecast
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The checks the deploy runs before it builds, on the records as this
      # pull request leaves them.
      - run: uv run python -m forecast.export

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # Every pull request gets a public preview: a version of the production
  # Worker, uploaded but not deployed, at a stable pr-<number> alias, built from
  # the records as the pull request leaves them (ADR-0010). It is not part of
  # `all-green`: the checks gate the merge, the preview is for reviewing it.
  preview:
    runs-on: ubuntu-latest
    environment: production
    # Pull requests from forks get no secrets, so they get no preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: forecast
          enable-cache: true
      - run: uv sync --locked --no-dev
        working-directory: forecast
      - run: uv run --no-dev python -m forecast.export
        working-directory: forecast
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cz-epf/web build
      - name: wrangler versions upload
        working-directory: web
        # An explicit `bash` runs with pipefail, so `| tee` keeps a failure.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler versions upload --preview-alias "$ALIAS" \
            --message "PR ${{ github.event.pull_request.number }}" | tee upload.log
          url=$(grep -oE "https://$ALIAS-[^ ]+\.workers\.dev" upload.log | head -1)
          echo "Preview: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"

  all-green:
    if: always()
    needs: [python, typescript]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
