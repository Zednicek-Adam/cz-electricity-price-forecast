# Local development needs Docker for exactly one thing: Postgres (ADR-0004).
# `uv`, `pnpm`, `wrangler dev` and Vite all run natively.
#
# The `dbmate` service narrows that, and it contradicts two ADRs to do it:
# ADR-0004's "Docker for exactly one thing" and ADR-0005's "a single static
# binary in CI". It is worth reopening because of how dbmate regenerates
# `db/schema.sql` — it shells out to `pg_dump`, and `pg_dump` writes both its
# own version and the server's into the dump. The pull request gate compares
# the regenerated schema against the committed one byte for byte (ADR-0010), so
# an unpinned client turns an unrelated Postgres release into a red build. A
# container pins the client; nothing else does it the same way locally and in
# CI.
#
# It is a one-shot `docker compose run --rm` rather than a service that stays
# up, so what ADR-0004's rule is protecting — that nothing is *developed*
# inside a container — holds. Only the letter of it moves.
services:
  db:
    # Track whatever version the Neon project runs; CI uses this same image, so
    # migrations and persistence tests have one code path. Pinned to the patch
    # because `pg_dump` writes the server version into `db/schema.sql`, so a
    # floating tag would make the gate's "the regenerated schema matches the
    # committed one" check fail on an unrelated Postgres release. Bumping this
    # is a commit that also regenerates the schema file.
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: czepf
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d czepf"]
      interval: 2s
      timeout: 3s
      retries: 15

  dbmate:
    image: ghcr.io/amacneil/dbmate:2.35.1
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/czepf?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db

volumes:
  db-data:
